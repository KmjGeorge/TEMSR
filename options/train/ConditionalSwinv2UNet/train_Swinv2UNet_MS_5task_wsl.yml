name: CSwinUNet_AT_p256w16b16_2gpu_nofreeze_5task
model_type: SwinUNetModel
scale: 1
num_gpu: 2
manual_seed: 12345

gt_size: 256

datasets:
  train:
    name: InstSIP
    type: InstructIRDataset
    phase: train
    color: gray
    dataset_root: /mnt/d/Datasets/InstSIP
    meta_info: /mnt/d/Datasets/InstSIP/meta_info_train.csv
    instruct_meta_info: /mnt/d/Datasets/InstSIP/prompts.csv
    lm_path: ./models/bge-micro-v2
    lm_head_weight_path: ./models/lm_head/model_head_256_dndbseglliesr_epoch40.pth
    text_dim: 256
    task_num: 5
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 6
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 100
    prefetch_mode: cuda
    pin_memory: true

  val:
    name: InstSIP
    type: InstructIRDataset
    phase: val
    color: gray
    dataset_root: /mnt/d/Datasets/InstSIP
    meta_info: /mnt/d/Datasets/InstSIP/meta_info_val.csv
    lm_head_weight_path: ./models/lm_head/model_head_256_dndbseglliesr_epoch40.pth
    text_dim: 256
    task_num: 5
    lm_path: ./models/bge-micro-v2
    io_backend:
      type: disk


network_g:
  type: ConditionalSwinv2UNet
  img_size: 256
  patch_size: 4
  in_chans: 1
  num_classes: 1
  embed_dim: 128
  depths: [2, 2, 18, 2]
  depths_decoder: [2, 2, 2, 2]
  num_heads: [4, 8, 16, 32]
  window_size: 16
  mlp_ratio: 4
  qkv_bias: True
  drop_rate: 0
  drop_path_rate: 0.1
  ape: False
  patch_norm: True
  freeze_encoder: False
  cond_dim: 256


# path
path:
  pretrain_network_g: ~
  # pretrain_network_g_e: ./models/swinv2/MS_ckpt_epoch_60.pth
  pretrain_network_g_e: ./models/swinv2/Atom_ckpt_epoch_70.pth
  param_key_g: model
  strict_load_g: true
  resume_state: /mnt/f/github/TEMSR/experiments/CSwinUNet_AT_p256w16b16_2gpu_nofreeze_5task/training_states/130000.state

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0.
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    gamma: 0.5
    milestones: [200000]
  total_iter: 300000
  warmup_iter: -1

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
#  fft_opt:
#    type: FFTLoss
#    loss_weight: 0.1
#    reduction: mean

val:
 val_freq: !!float 5e4
 save_img: true
 metrics:
   psnr: # metric name
     type: calculate_psnr
     crop_border: 0
     test_y_channel: false
   ssim:
     type: calculate_ssim
     crop_border: 0
     test_y_channel: false


# logging settings
logger:
  print_freq: 500
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

