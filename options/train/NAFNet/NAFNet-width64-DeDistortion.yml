name: NAFNet-2248_12_2222_p128b4_DeDistortion
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 12345

gt_size: 128

datasets:
  train:
    name: Warwick_Denoise
    type: PairedImageDataset
    color: gray
    dataroot_gt: /root/autodl-tmp/train
    dataroot_lq: /root/autodl-tmp/DeDistortion/train
    meta_info: ~

    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 50
    prefetch_mode: cuda
    pin_memory: true

  val:
    name: Warwick_Denoise
    type: PairedImageDataset
    color: gray
    dataroot_gt: /root/autodl-tmp/val
    dataroot_lq: /root/autodl-tmp/DeDistortion/val
    io_backend:
      type: disk


network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [ 2, 2, 4, 8 ]
  middle_blk_num: 12
  dec_blk_nums: [ 2, 2, 2, 2 ]
  img_channel: 1

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0.
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [100000, 200000]
    gamma: 0.5
  total_iter: 300000
  warmup_iter: -1

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
#  fft_opt:
#    type: FFTLoss
#    loss_weight: 0.02
#    reduction: mean

val:
 val_freq: !!float 2e4
 save_img: false
 metrics:
   psnr: # metric name
     type: calculate_psnr
     crop_border: 0
     test_y_channel: false
   ssim:
     type: calculate_ssim
     crop_border: 0
     test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 2e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

