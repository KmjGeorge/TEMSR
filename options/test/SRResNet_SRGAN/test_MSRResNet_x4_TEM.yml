# ----------- Commands for running
# ----------- Single GPU
# PYTHONPATH="./:${PYTHONPATH}"  CUDA_VISIBLE_DEVICES=0 python basicsr/test.py -opt options/test/SRResNet_SRGAN/test_MSRResNet_x4.yml

# general settings
name: MSRResNet_x4_f64b16_TEM_400k_B16
model_type: SRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# test dataset settings
datasets:
  test_1:
    name: TEM_val
    type: PairedImageDataset
    color: gray
    dataroot_gt: D:\Datasets\DegAEPretrain\val
    dataroot_lq: D:\Datasets\DegAEPretrain\val_LRbicx4
    io_backend:
      type: disk

# network structures
network_g:
  type: MSRResNet
  num_in_ch: 1
  num_out_ch: 1
  num_feat: 64
  num_block: 16
  upscale: 4

# path
path:
  pretrain_network_g: F:\github\TEMSR\experiments\MSRResNet_x4_f64b16_TEM_400k_B16\models\net_g_200000.pth
  param_key_g: params_ema
  strict_load_g: true

# validation settings
val:
  save_img: false
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
      better: higher  # the higher, the better. Default: higher
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
      better: higher
