name: MPRNet_f48_p128b4_DeBG
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 12345

gt_size: 128

datasets:
  test_1:
    name: Warwick_DeBG
    type: PairedImageDataset
    color: gray
    dataroot_gt: D:/Datasets/DegAEFT/HQ/val
    dataroot_lq: D:/Datasets/DegAEFT/DeBG/val
    io_backend:
      type: disk


network_g:
  type: MPRNet
  in_c: 1
  out_c: 1
  n_feat: 48
  scale_unetfeats: 32
  scale_orsnetfeats: 32
  num_cab: 8
  kernel_size: 3
  reduction: 4
  bias: false

# path
path:
  pretrain_network_g: F:\github\TEMSR\experiments\DegAE_FT\MPRNet_f48_p128b4_DeBG\models\net_g_200000.pth
  strict_load_g: true
  param_key_g: params_ema


val:
 save_img: true
 suffix: MPRNet_DeBG
 metrics:
   psnr: # metric name
     type: calculate_psnr
     crop_border: 0
     test_y_channel: false
   ssim:
     type: calculate_ssim
     crop_border: 0
     test_y_channel: false


