name: DegAE_InstructIR_TEM_t256_p128b4_scratch
model_type: DegAE_InstructIRModel
scale: 1
num_gpu: 1
manual_seed: 12345

gt_size: 128

datasets:

  test_1:
    name: InstSIP_Denoise
    type: InstructIRDataset
    phase: val
    color: gray
    dataset_root: D:/Datasets/DegAEFT
    meta_info: D:/Datasets/DegAEFT/meta_info_val_denoise.csv
    lm_path: F:/github/TEMSR/models/bge-micro-v2
    lm_head_weight_path: F:/github/TEMSR/models/lm_head/model_head_256_dn_db_dd_ll_epoch90.pth
    text_dim: 256
    task_num: 4
    io_backend:
      type: disk

  test_2:
    name: InstSIP_DeBG
    type: InstructIRDataset
    phase: val
    color: gray
    dataset_root: D:/Datasets/DegAEFT
    meta_info: D:/Datasets/DegAEFT/meta_info_val_debg.csv
    lm_path: F:/github/TEMSR/models/bge-micro-v2
    lm_head_weight_path: F:/github/TEMSR/models/lm_head/model_head_256_dn_db_dd_ll_epoch90.pth
    text_dim: 256
    task_num: 4
    io_backend:
      type: disk

  test_3:
    name: InstSIP_DeDistortion
    type: InstructIRDataset
    phase: val
    color: gray
    dataset_root: D:/Datasets/DegAEFT
    meta_info: D:/Datasets/DegAEFT/meta_info_val_dedistortion.csv
    lm_path: F:/github/TEMSR/models/bge-micro-v2
    lm_head_weight_path: F:/github/TEMSR/models/lm_head/model_head_256_dn_db_dd_ll_epoch90.pth
    text_dim: 256
    task_num: 4
    io_backend:
      type: disk

  test_4:
    name: InstSIP_LLIE
    type: InstructIRDataset
    phase: val
    color: gray
    dataset_root: D:/Datasets/DegAEFT
    meta_info: D:/Datasets/DegAEFT/meta_info_val_llie.csv
    lm_path: F:/github/TEMSR/models/bge-micro-v2
    lm_head_weight_path: F:/github/TEMSR/models/lm_head/model_head_256_dn_db_dd_ll_epoch90.pth
    text_dim: 256
    task_num: 4
    io_backend:
      type: disk

network_g:
  type: DegAE_InstructIR
  inp_channels: 1
  head_channels: 64
  dim: 48
  num_blocks: [ 4,6,6,8 ]
  num_refinement_blocks: 4
  heads: [ 1,2,4,8 ]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: false
  global_residual: false
  text_dim: 256
  decoder_blk_nums: [2,2,2,2]

# path
path:
  pretrain_network_g: F:\github\TEMSR\experiments\DegAE_FT\DegAE_InstructIR_TEM_t256_p128b4_scratch\models\net_g_480000.pth
  pretrain_network_encoder: ~
  strict_load_g: true
  resume_state: ~
  param_key_g: params_ema

val:
 save_img: true
 suffix: InsTEMIR_scratch
 metrics:
   psnr: # metric name
     type: calculate_psnr
     crop_border: 0
     test_y_channel: false
   ssim:
     type: calculate_ssim
     crop_border: 0
     test_y_channel: false


